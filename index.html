<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRZ'TempoFit</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --neon-green: #33FF14;
            --text-color: #FFFFFF;
            --text-secondary: #8E8E93;
            --separator: #38383A;
            --danger: #FF453A;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 20px 40px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- HEADER & SETTINGS --- */
        .app-header-container {
            position: relative;
            margin-bottom: 5px;
            padding-top: 10px;
        }

        .settings-btn {
            position: absolute;
            top: 10px;
            right: 0;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .settings-btn:active { opacity: 1; }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #ddd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            text-align: center;
            display: block;
        }
        
        .logo span {
            color: var(--neon-green);
            -webkit-text-fill-color: var(--neon-green);
        }

        /* --- PIXEL ART --- */
        .pixel-art-container {
            text-align: center;
            margin-bottom: 25px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pixel-svg {
            width: 60px;
            height: 60px;
            image-rendering: pixelated; /* Force le rendu pixel art */
        }
        
        /* Petite animation de respiration */
        .pixel-svg {
            animation: breathe 2s infinite ease-in-out;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* --- PROGRESSION SYSTEM --- */
        .progression-container {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-top: 25px; /* Décalé vers le bas */
            text-align: center;
            border: 1px solid #333;
        }

        .progression-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .progression-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .progress-bar-bg {
            background-color: #333;
            height: 10px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            background-color: var(--neon-green);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .set-goal-btn {
            background: none;
            border: 1px dashed var(--text-secondary);
            color: var(--text-secondary);
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }

        /* --- COMMON UI --- */
        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            flex: 1;
        }

        .screen.active { display: flex; }

        .option-btn {
            background-color: var(--card-bg);
            border: none;
            color: var(--text-color);
            padding: 18px 20px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .option-btn:active { background-color: #333; }
        .option-btn span { font-size: 1.4rem; }

        input[type="text"], input[type="number"] {
            background-color: var(--card-bg);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            width: 100%;
            outline: none;
        }

        input:focus { box-shadow: 0 0 0 2px var(--neon-green); }

        /* Time Input Style */
        .time-input-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        input[type="time"] {
            background: transparent;
            border: none;
            color: var(--neon-green);
            font-size: 22px;
            font-weight: 600;
            font-family: -apple-system, sans-serif;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            text-align: right;
            padding: 0;
            margin: 0;
        }

        /* Map */
        #map {
            height: 250px;
            width: 100%;
            border-radius: 14px;
            margin-bottom: 10px;
            z-index: 1;
        }

        /* Actions */
        .actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }
        
        .btn-primary {
            background-color: var(--neon-green);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 17px;
            width: 100%;
            cursor: pointer;
        }

        /* Nouveau bouton retour uniformisé */
        .btn-back {
            background-color: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 18px; /* Même taille que btn-primary */
            border-radius: 14px;
            font-weight: 700;
            font-size: 17px;
            width: 100%;
            cursor: pointer;
            text-align: center;
        }
        
        .btn-back:active {
            background-color: rgba(51, 255, 20, 0.1);
        }

        .btn-danger {
            background-color: rgba(255, 69, 58, 0.1);
            color: var(--danger);
            border: none;
            padding: 15px;
            font-weight: 600;
            border-radius: 14px;
            margin-top: 10px;
            width: 100%;
            cursor: pointer;
        }

        /* Recap */
        .recap-card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 20px;
        }
        .recap-line {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--separator);
            padding-bottom: 15px;
        }
        .recap-line:last-child { border-bottom: none; }
        .recap-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .recap-value { font-size: 18px; color: white; font-weight: 500; }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-header-container">
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="logo">GRZ'<span>TempoFit</span></div>
    </div>

    <div class="pixel-art-container">
        <svg class="pixel-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="4" width="4" height="4" fill="#33FF14"/>
            <rect x="11" y="5" width="1" height="1" fill="black"/>
            <rect x="12" y="5" width="1" height="1" fill="black"/>
            <rect x="9" y="8" width="6" height="5" fill="#33FF14"/>
            <rect x="9" y="13" width="2" height="3" fill="#33FF14"/>
            <rect x="13" y="13" width="2" height="3" fill="#33FF14"/>
            <rect x="7" y="8" width="2" height="2" fill="#33FF14"/>
            <rect x="15" y="8" width="2" height="2" fill="#33FF14"/>
            <rect x="6" y="6" width="2" height="2" fill="#33FF14"/>
            <rect x="16" y="6" width="2" height="2" fill="#33FF14"/>
            <rect x="4" y="5" width="2" height="2" fill="#8E8E93"/>
            <rect x="18" y="5" width="2" height="2" fill="#8E8E93"/>
            <rect x="6" y="6" width="12" height="1" fill="#8E8E93"/> 
        </svg>
    </div>

    <div id="screen-sport-type" class="screen active">
        
        <h2 style="text-align: left; margin-left: 5px;">Quel type de séance ?</h2>
        
        <button class="option-btn" onclick="selectSport('muscu')">
            Séance de muscu <span>🏋️‍♂️</span>
        </button>
        <button class="option-btn" onclick="alert('Fonctionnalité Running à venir !')">
            Séance running <span>🏃‍♂️</span>
        </button>

        <div id="progression-wrapper">
            </div>
    </div>

    <div id="screen-settings" class="screen">
        <h2>Paramètres</h2>
        
        <label class="recap-label">Objectif hebdomadaire</label>
        <input type="number" id="setting-goal-input" placeholder="Nombre de séances" inputmode="numeric">
        <button class="btn-primary" style="margin-top: 10px;" onclick="saveSettingsGoal()">Enregistrer l'objectif</button>

        <hr style="border: 0; border-top: 1px solid var(--separator); width: 100%; margin: 20px 0;">

        <button class="btn-danger" onclick="resetProgress()">Réinitialiser la progression</button>

        <div class="actions">
            <button class="btn-back" onclick="goToScreen('screen-sport-type')">Retour</button>
        </div>
    </div>

    <div id="screen-muscu-type" class="screen">
        <h2>Quel groupe musculaire ?</h2>
        
        <button class="option-btn" onclick="selectRoutine('Biceps + Triceps 💪')">
            Biceps + Triceps <span>💪</span>
        </button>
        <button class="option-btn" onclick="selectRoutine('Pecs, dos, épaules + DC 🏋️‍♂️')">
            Pecs, dos, épaules + DC <span>🏋️‍♂️</span>
        </button>
        <button class="option-btn" onclick="selectRoutine('Cardio/fonctionnel 🏃‍♂️')">
            Cardio/fonctionnel <span>🏃‍♂️</span>
        </button>
        <button class="option-btn" onclick="selectRoutine('Jambes 🦵')">
            Jambes <span>🦵</span>
        </button>
        <button class="option-btn" onclick="showManualRoutineInput()">
            Saisie manuelle <span>📝</span>
        </button>

        <div id="manual-routine-container" class="hidden" style="margin-top:10px">
            <input type="text" id="manual-routine-input" placeholder="Ex: Abdos + Rappel dos" autofocus>
            <button class="btn-primary" style="margin-top:10px" onclick="submitManualRoutine()">Valider</button>
        </div>

        <div class="actions">
            <button class="btn-back" onclick="goToScreen('screen-sport-type')">Retour</button>
        </div>
    </div>

    <div id="screen-location" class="screen">
        <h2 id="location-title">Recherche Basic-Fit...</h2>
        
        <div id="map"></div>
        <input type="text" id="location-input" placeholder="Recherche en cours...">
        
        <div class="actions">
            <button class="btn-primary" onclick="confirmLocation()">Confirmer le lieu</button>
            <button class="btn-back" onclick="goToScreen('screen-muscu-type')">Retour</button>
            <button class="btn-secondary" style="font-size:14px; margin-top:5px; border:none; padding:10px;" onclick="enableManualLocation()">Lieu incorrect ? Saisir manuellement</button>
        </div>
    </div>

    <div id="screen-time" class="screen">
        <h2>Horaires de la séance</h2>
        
        <div class="time-input-container">
            <span style="font-size:17px; color:white;">Début</span>
            <input type="time" id="start-time">
        </div>
        
        <div class="time-input-container">
            <span style="font-size:17px; color:white;">Fin</span>
            <input type="time" id="end-time">
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="goToRecap()">Voir le récapitulatif</button>
            <button class="btn-back" onclick="goToScreen('screen-location')">Retour</button>
        </div>
    </div>

    <div id="screen-recap" class="screen">
        <h2>Confirmation</h2>
        
        <div class="recap-card">
            <div class="recap-line">
                <div class="recap-label">Activité</div>
                <div class="recap-value" id="recap-desc">...</div>
            </div>
            <div class="recap-line">
                <div class="recap-label">Lieu</div>
                <div class="recap-value" id="recap-location">...</div>
            </div>
            <div class="recap-line">
                <div class="recap-label">Créneau</div>
                <div class="recap-value" id="recap-time" style="color: var(--neon-green)">...</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="generateICS()">Ajouter au calendrier 📅</button>
            <button class="btn-back" onclick="goToScreen('screen-time')">Modifier</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- GESTION DES DONNÉES / PROGRESSION ---
        const storageKey = 'grz_tempofit_data';
        let appData = {
            goal: 0,
            current: 0,
            lastWeek: getWeekNumber(new Date())
        };

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return weekNo;
        }

        function loadData() {
            const stored = localStorage.getItem(storageKey);
            if (stored) {
                const parsed = JSON.parse(stored);
                const currentWeek = getWeekNumber(new Date());
                if (parsed.lastWeek !== currentWeek) {
                    parsed.current = 0; 
                    parsed.lastWeek = currentWeek;
                    saveData(parsed); 
                }
                appData = parsed;
            }
            renderProgression();
        }

        function saveData(data) {
            appData = data || appData;
            localStorage.setItem(storageKey, JSON.stringify(appData));
            renderProgression();
        }

        function renderProgression() {
            const container = document.getElementById('progression-wrapper');
            container.innerHTML = '';

            if (!appData.goal || appData.goal == 0) {
                const btn = document.createElement('button');
                btn.className = 'set-goal-btn';
                btn.innerText = "Définir un objectif hebdomadaire 🎯";
                btn.onclick = openSettings;
                container.appendChild(btn);
            } else {
                const pct = Math.min((appData.current / appData.goal) * 100, 100);
                
                const html = `
                    <div class="progression-container">
                        <div class="progression-title">Objectif 🎯 :</div>
                        <div class="progression-text">Vous en êtes à ${appData.current} / ${appData.goal} séances cette semaine</div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }
        }

        function openSettings() {
            document.getElementById('setting-goal-input').value = appData.goal || '';
            goToScreen('screen-settings');
        }

        function saveSettingsGoal() {
            const val = parseInt(document.getElementById('setting-goal-input').value);
            if (val && val > 0) {
                appData.goal = val;
                saveData();
                goToScreen('screen-sport-type');
            } else {
                alert("Veuillez entrer un chiffre valide.");
            }
        }

        function resetProgress() {
            if(confirm("Voulez-vous vraiment remettre la progression à zéro pour cette semaine ?")) {
                appData.current = 0;
                saveData();
                alert("Progression réinitialisée.");
                goToScreen('screen-sport-type');
            }
        }

        function incrementProgress() {
            if (appData.goal > 0) {
                appData.current += 1;
                saveData();
            }
        }

        // --- STATE & NAVIGATION ---
        const state = {
            sportType: '',
            routine: '',
            locationName: '',
            locationAddress: '',
            startTime: '',
            endTime: ''
        };
        let map, marker;

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'screen-location' && !map) setTimeout(initMap, 100);
        }

        function selectSport(type) {
            state.sportType = type;
            if (type === 'muscu') goToScreen('screen-muscu-type');
        }

        function selectRoutine(routine) {
            state.routine = routine;
            goToScreen('screen-location');
        }

        function showManualRoutineInput() {
            document.getElementById('manual-routine-container').classList.remove('hidden');
        }

        function submitManualRoutine() {
            const val = document.getElementById('manual-routine-input').value;
            if (val) {
                state.routine = val + ' 📝';
                goToScreen('screen-location');
            }
        }

        // --- MAP & LOCATION (OVERPASS API) ---
        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([46.603354, 1.888334], 6);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '', subdomains: 'abcd', maxZoom: 19
            }).addTo(map);

            const gymIcon = L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:#33FF14;width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 15px #33FF14'></div>",
                iconSize: [20, 20], iconAnchor: [10, 10]
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    map.setView([lat, lon], 15);
                    if (marker) map.removeLayer(marker);
                    marker = L.marker([lat, lon], {icon: gymIcon}).addTo(map);

                    document.getElementById('location-title').innerText = "Recherche Basic-Fit proches...";
                    
                    try {
                        // Regex: Basic[- ]?Fit -> Trouve "Basic-Fit", "Basic Fit" ou "BasicFit"
                        const overpassQuery = `
                            [out:json];
                            (
                              node["name"~"Basic[- ]?Fit",i](around:5000,${lat},${lon});
                              way["name"~"Basic[- ]?Fit",i](around:5000,${lat},${lon});
                            );
                            out center;
                        `;
                        
                        const response = await fetch('https://overpass-api.de/api/interpreter', {
                            method: 'POST',
                            body: overpassQuery
                        });
                        const data = await response.json();

                        if (data.elements && data.elements.length > 0) {
                            const place = data.elements[0];
                            const tags = place.tags;
                            const name = tags.name || "Basic-Fit";
                            
                            let street = tags['addr:street'] || "";
                            let city = tags['addr:city'] || "";
                            
                            if (!street) {
                                const pLat = place.lat || place.center.lat;
                                const pLon = place.lon || place.center.lon;
                                const revRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pLat}&lon=${pLon}`);
                                const revData = await revRes.json();
                                street = revData.address.road || "";
                                city = revData.address.city || revData.address.town || "";
                            }

                            const fullAddr = `${street}, ${city}`;
                            document.getElementById('location-title').innerText = `Est-ce bien ce club ?`;
                            document.getElementById('location-input').value = `${name} - ${fullAddr}`;
                            state.locationName = name;
                            state.locationAddress = fullAddr;
                            
                            const clubLat = place.lat || place.center.lat;
                            const clubLon = place.lon || place.center.lon;
                            marker.setLatLng([clubLat, clubLon]);
                            map.setView([clubLat, clubLon], 16);

                        } else {
                            throw new Error("Aucun Basic-Fit trouvé proche");
                        }

                    } catch (e) {
                        console.log(e);
                        fallbackReverseGeocode(lat, lon);
                    }

                }, () => { enableManualLocation(); });
            } else { enableManualLocation(); }
        }

        async function fallbackReverseGeocode(lat, lon) {
             try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                const city = data.address.city || data.address.town || "";
                const fullAddr = (data.address.road || "") + ", " + city;
                const name = `Basic-Fit ${city}`;
                
                document.getElementById('location-title').innerText = "Pas de club détecté, ville trouvée :";
                document.getElementById('location-input').value = `${name} (${fullAddr})`;
                state.locationName = name;
                state.locationAddress = fullAddr;
            } catch(e) {
                enableManualLocation();
            }
        }

        function enableManualLocation() {
            const input = document.getElementById('location-input');
            input.value = "";
            input.placeholder = "Saisir nom et adresse...";
            input.focus();
            document.getElementById('location-title').innerText = "Où est la salle ?";
        }

        function confirmLocation() {
            const val = document.getElementById('location-input').value;
            if (val) {
                if(!state.locationAddress) state.locationAddress = val;
                
                const now = new Date();
                const pad = (n) => n < 10 ? '0' + n : n;
                document.getElementById('start-time').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
                const nextHour = new Date(now.getTime() + 60*60*1000);
                document.getElementById('end-time').value = `${pad(nextHour.getHours())}:${pad(nextHour.getMinutes())}`;

                goToScreen('screen-time');
            } else {
                alert("Merci d'indiquer un lieu");
            }
        }

        function goToRecap() {
            state.startTime = document.getElementById('start-time').value;
            state.endTime = document.getElementById('end-time').value;
            const desc = `Séance ${state.routine}`;
            const locationDisplay = state.locationName ? `${state.locationName}` : (state.locationAddress || "Basic-Fit");
            
            document.getElementById('recap-desc').innerText = desc;
            document.getElementById('recap-location').innerText = locationDisplay;
            document.getElementById('recap-time').innerText = `${state.startTime} - ${state.endTime}`;

            goToScreen('screen-recap');
        }

        function generateICS() {
            incrementProgress();

            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const [sh, sm] = state.startTime.split(':');
            const [eh, em] = state.endTime.split(':');
            const dtStart = `${year}${month}${day}T${sh}${sm}00`;
            const dtEnd = `${year}${month}${day}T${eh}${em}00`;

            const summary = "Séance de sport";
            const description = `Séance ${state.routine} au ${state.locationName || 'Basic-Fit'}`;
            const locationField = `${state.locationName || 'Basic-Fit'}, ${state.locationAddress}`;

            const icsContent = [
                'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GRZTempoFit//FR',
                'BEGIN:VEVENT', `UID:${Date.now()}@grztempofit.com`,
                `DTSTAMP:${dtStart}Z`, `DTSTART:${dtStart}`, `DTEND:${dtEnd}`,
                `SUMMARY:${summary}`, `DESCRIPTION:${description}`, `LOCATION:${locationField}`,
                'BEGIN:VALARM', 'TRIGGER:-PT15M', 'ACTION:DISPLAY', 'DESCRIPTION:Go Sport !', 'END:VALARM',
                'END:VEVENT', 'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'seance.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = loadData;
    </script>
</body>
</html>
